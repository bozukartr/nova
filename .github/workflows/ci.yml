name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Testler
        run: npm test

      - name: Derleme
        run: npm run build

      - name: dist güncel mi
        run: |
          if ! git diff --quiet -- dist/; then
            echo "dist/index.html kaynakla uyumsuz — 'npm run build' çalıştırıp sonucu işleyin."
            git --no-pager diff --stat -- dist/
            exit 1
          fi
